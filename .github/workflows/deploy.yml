name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Read native reference revision
        id: reference
        run: node -e "const fs=require('fs'); const pin=JSON.parse(fs.readFileSync('open-brush-reference.json')); fs.appendFileSync(process.env.GITHUB_OUTPUT, 'commit='+pin.commit+'\n');"
      - name: Check out pinned native reference
        uses: actions/checkout@v4
        with:
          repository: icosa-foundation/open-brush
          ref: ${{ steps.reference.outputs.commit }}
          path: reference
          persist-credentials: false
      - name: Verify brush asset regeneration
        run: npm run check:brush-regeneration
      - name: Retain regeneration diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brush-asset-regeneration
          path: |
            .tmp/brush-asset-regeneration.json
            .tmp/brush-regeneration-*/extraction.log
          include-hidden-files: true
      - run: npm run check
      - run: npm run build
      - run: npm run test:browser:materials
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
